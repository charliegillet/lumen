app = "lumen-group-chat"
primary_region = "sjc"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/chat.db"
  MODEL_AGENT = "openai:gpt-5.6-luna"
  MODEL_GATE = "openai:gpt-5.6-luna"
  MODEL_CLASSIFIER = "openai:gpt-5.6-luna"

[mounts]
  source = "chat_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # in-memory actors must not be stopped mid-turn
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
